<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>tschudis.ch</title>
<meta name="description" content="The Tschudi family.">
<meta name="theme-color" content="#060a18">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23060a18%22/><path d=%22M8 82 L34 38 L46 54 L60 26 L92 82 Z%22 fill=%22%23c9d6ff%22/></svg>">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#060a18; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .mark {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    font: 300 clamp(28px, 6vw, 72px)/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    letter-spacing:.4em; text-indent:.4em; color:#e6edff; opacity:0; text-transform:lowercase;
    text-shadow: 0 0 24px rgba(160,190,255,.45), 0 2px 12px rgba(0,0,0,.5);
    animation: fade 3s 1.5s ease forwards; pointer-events:none; user-select:none; white-space:nowrap;
  }
  @keyframes fade { to { opacity:.85; } }
  @media (prefers-reduced-motion: reduce) { .mark { animation-duration:.01s; animation-delay:0s; } }
</style>
</head>
<body>
<canvas id="c" aria-label="An animated alpine night sky"></canvas>
<div class="mark" aria-hidden="true">tschudis</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr;

  // --- deterministic random ---------------------------------------------
  const seed = s => () => (s = (s * 16807) % 2147483647) / 2147483647;

  // --- scene state ---------------------------------------------------------
  let stars = [], ridges = [], meteors = [], snow = [];
  let px = 0, py = 0, tx = 0, ty = 0;      // parallax (current, target)

  function ridge(rand, base, amp, freq, rough, color, depth) {
    const pts = [];
    const n = 220;
    let phase = rand() * 100;
    for (let i = 0; i <= n; i++) {
      const x = i / n;
      let y = 0, a = amp, f = freq, p = phase;
      for (let o = 0; o < 5; o++) {      // fractal ridge
        y += Math.sin(x * f * Math.PI * 2 + p) * a
           + Math.abs(Math.sin(x * f * 1.7 * Math.PI + p * .7)) * a * .6;
        a *= rough; f *= 2.1; p += 7.3;
      }
      pts.push({ x, y: base - y });
    }
    return { pts, color, depth };
  }

  function build() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const r = seed(1291);   // 1291: the founding of Switzerland, of course
    stars = [];
    const count = Math.round((W * H) / 2600);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: r(), y: r() * .78, s: Math.pow(r(), 3) * 1.6 + .3,
        tw: r() * Math.PI * 2, sp: .4 + r() * 1.6, depth: .2 + r() * .5,
      });
    }
    ridges = [
      ridge(r, .56, .045, 1.1, .5, '#25325a', .18),
      ridge(r, .64, .055, 1.6, .5, '#1a2444', .32),
      ridge(r, .72, .06,  2.1, .52,'#111a34', .5),
      ridge(r, .82, .05,  2.8, .55,'#0a1024', .75),
      ridge(r, .92, .035, 3.6, .55,'#05081a', 1),
    ];
    snow = [];
    for (let i = 0; i < 90; i++) snow.push({ x: r(), y: r(), s: .5 + r() * 1.4, v: .15 + r() * .35, o: r() * 6 });
  }

  // --- meteors -------------------------------------------------------------
  function spawnMeteor(x, y) {
    const a = Math.PI * (.62 + Math.random() * .18);        // down-left-ish
    meteors.push({
      x: x ?? Math.random() * W * 1.1, y: y ?? Math.random() * H * .3,
      vx: Math.cos(a) * -1 * (9 + Math.random() * 6), vy: Math.sin(a) * (9 + Math.random() * 6),
      life: 1, decay: .012 + Math.random() * .012, len: 90 + Math.random() * 120,
    });
  }
  canvas.addEventListener('pointerdown', e => spawnMeteor(e.clientX, e.clientY));

  // --- parallax ------------------------------------------------------------
  addEventListener('pointermove', e => {
    tx = (e.clientX / W - .5) * 2; ty = (e.clientY / H - .5) * 2;
  }, { passive: true });
  addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    tx = Math.max(-1, Math.min(1, e.gamma / 30));
    ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
  }, { passive: true });

  // --- draw ----------------------------------------------------------------
  function frame(now) {
    const t = now / 1000;
    px += (tx - px) * .04; py += (ty - py) * .04;

    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#04061a'); sky.addColorStop(.5, '#0b1330'); sky.addColorStop(1, '#1d2a55');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // aurora
    ctx.globalCompositeOperation = 'lighter';
    for (let b = 0; b < 3; b++) {
      const yb = H * (.22 + b * .07) + Math.sin(t * .17 + b) * H * .03 + py * 10;
      const g = ctx.createLinearGradient(0, yb - H * .22, 0, yb + H * .08);
      const hue = 150 + b * 25 + Math.sin(t * .1 + b) * 15;
      g.addColorStop(0, `hsla(${hue},80%,60%,0)`);
      g.addColorStop(.6, `hsla(${hue},80%,60%,${.07 + Math.sin(t * .3 + b * 2) * .025})`);
      g.addColorStop(1, `hsla(${hue},80%,60%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 12) {
        const u = x / W;
        const y = yb + Math.sin(u * 5 + t * .25 + b) * H * .05 + Math.sin(u * 13 - t * .4) * H * .02;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // stars (slow rotation about a point high right)
    const cx = W * .78, cy = -H * .1, rot = reduced ? 0 : t * .004;
    const cos = Math.cos(rot), sin = Math.sin(rot);
    for (const s of stars) {
      const ox = s.x * W - cx, oy = s.y * H - cy;
      const x = cx + ox * cos - oy * sin - px * 14 * s.depth;
      const y = cy + ox * sin + oy * cos - py * 8 * s.depth;
      const a = .45 + .55 * Math.sin(s.tw + t * s.sp) ** 2;
      ctx.fillStyle = `rgba(230,238,255,${a})`;
      ctx.beginPath(); ctx.arc(x, y, s.s, 0, 7); ctx.fill();
    }

    // moon
    const mx = W * .74 - px * 10, my = H * .2 - py * 6, mr = Math.min(W, H) * .045;
    const halo = ctx.createRadialGradient(mx, my, mr * .6, mx, my, mr * 5);
    halo.addColorStop(0, 'rgba(220,230,255,.32)'); halo.addColorStop(1, 'rgba(220,230,255,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(mx, my, mr * 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#f2f4ff'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.fill();
    ctx.fillStyle = '#0b1330'; ctx.beginPath(); ctx.arc(mx - mr * .38, my - mr * .12, mr * .88, 0, 7); ctx.fill();

    // meteors
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx; m.y += m.vy; m.life -= m.decay;
      if (m.life <= 0 || m.y > H) { meteors.splice(i, 1); continue; }
      const nx = m.vx, ny = m.vy, L = Math.hypot(nx, ny);
      const gx = m.x - nx / L * m.len, gy = m.y - ny / L * m.len;
      const g = ctx.createLinearGradient(m.x, m.y, gx, gy);
      g.addColorStop(0, `rgba(255,255,255,${m.life})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(gx, gy); ctx.stroke();
    }
    if (!reduced && Math.random() < .004) spawnMeteor();

    // mountains with parallax + faint snowline haze
    for (const r of ridges) {
      const dx = -px * 40 * r.depth, dy = -py * 18 * r.depth + (1 - r.depth) * H * .02;
      ctx.fillStyle = r.color;
      ctx.beginPath(); ctx.moveTo(-60, H + 60);
      for (const p of r.pts) ctx.lineTo(p.x * (W + 120) - 60 + dx, p.y * H + dy);
      ctx.lineTo(W + 60, H + 60); ctx.closePath(); ctx.fill();
      // mist
      const mist = ctx.createLinearGradient(0, 0, 0, H);
      mist.addColorStop(0, 'rgba(120,150,220,0)'); mist.addColorStop(1, `rgba(120,150,220,${.08 * (1 - r.depth)})`);
      ctx.fillStyle = mist; ctx.fill();
    }

    // drifting snow / dust in the foreground
    if (!reduced) {
      ctx.fillStyle = 'rgba(210,222,255,.55)';
      for (const f of snow) {
        f.y += f.v * .0008; if (f.y > 1) f.y -= 1;
        const x = (f.x + Math.sin(t * .4 + f.o) * .01 - px * .02) * W;
        const y = f.y * H;
        ctx.globalAlpha = .25 + .35 * Math.sin(t + f.o) ** 2;
        ctx.beginPath(); ctx.arc(x, y, f.s, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // vignette
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .4, W / 2, H / 2, Math.max(W, H) * .8);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }

  addEventListener('resize', build);
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
