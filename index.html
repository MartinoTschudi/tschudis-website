<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>tschudis.ch</title>
<meta name="description" content="The Tschudi family.">
<meta name="theme-color" content="#9ed4ff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%239ed4ff%22/><circle cx=%2268%22 cy=%2236%22 r=%2216%22 fill=%22%23ffd166%22/><path d=%22M0 100 Q30 55 60 75 T100 65 V100 Z%22 fill=%22%2372c66a%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#9ed4ff; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer; }
  .mark {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    font: 400 clamp(36px, 7vw, 92px)/1 "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    letter-spacing:.22em; text-indent:.22em; color:#1a2447; opacity:0; text-transform:lowercase;
    animation: fade 2s .8s ease forwards; pointer-events:none; user-select:none; white-space:nowrap;
  }
  @keyframes fade { to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .mark { animation-duration:.01s; animation-delay:0s; } }
</style>
</head>
<body>
<canvas id="c" aria-label="A sunny animated alpine meadow with balloons and confetti"></canvas>
<div class="mark" aria-hidden="true">tschudis</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr;
  const TAU = Math.PI * 2;
  const seed = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
  const PAL = ['#ff6b6b','#ffd166','#06d6a0','#4cc9f0','#f72585','#ff9f1c','#b5179e','#80ed99'];

  let hills = [], clouds = [], flowers = [], birds = [], balloons = [], confetti = [], bfl = [];
  let px = 0, py = 0, tx = 0, ty = 0;

  function ridge(rand, base, amp, freq, color, depth) {
    const pts = [], n = 160, phase = rand() * 100;
    for (let i = 0; i <= n; i++) {
      const x = i / n;
      const y = Math.sin(x * freq * TAU + phase) * amp
              + Math.sin(x * freq * 2.3 * TAU + phase * 1.7) * amp * .35
              + Math.sin(x * freq * 5.1 * TAU + phase * .4) * amp * .12;
      pts.push({ x, y: base - y });
    }
    return { pts, color, depth };
  }
  function hillY(h, u) {           // sample a hill's surface at 0..1
    const i = Math.max(0, Math.min(h.pts.length - 1, Math.round(u * (h.pts.length - 1))));
    return h.pts[i].y;
  }

  function build() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const r = seed(1291);
    hills = [
      ridge(r, .66, .05, .9,  '#bfe6a1', .25),
      ridge(r, .74, .05, 1.3, '#93d67a', .5),
      ridge(r, .83, .045, 1.8, '#6ec55f', .75),
      ridge(r, .93, .04, 2.4, '#4fae4a', 1),
    ];
    clouds = [];
    for (let i = 0; i < 9; i++) {
      const puffs = [];
      const n = 4 + Math.floor(r() * 4);
      for (let k = 0; k < n; k++) puffs.push({ dx: (k - n / 2) * 26 + r() * 14, dy: -r() * 22, rr: 20 + r() * 26 });
      clouds.push({ x: r(), y: .06 + r() * .32, s: .6 + r() * 1.1, v: .004 + r() * .01, depth: .3 + r() * .6, puffs });
    }
    flowers = [];
    for (let i = 0; i < 120; i++) {
      const h = 1 + Math.floor(r() * 3);
      flowers.push({ u: r(), h, c: PAL[Math.floor(r() * PAL.length)], s: 2.5 + r() * 3, o: r() * TAU });
    }
    birds = [];
    for (let i = 0; i < 6; i++) birds.push({ x: r(), y: .1 + r() * .3, v: .02 + r() * .02, o: r() * TAU, s: .7 + r() * .6 });
    bfl = [];
    for (let i = 0; i < 7; i++) bfl.push({ x: r() * W, y: H * (.55 + r() * .3), a: r() * TAU, c: PAL[Math.floor(r() * PAL.length)], o: r() * TAU });
  }

  function spawnBalloon(x, y) {
    balloons.push({ x, y, vx: (Math.random() - .5) * .6, vy: -(1.2 + Math.random() * .8),
      c: PAL[Math.floor(Math.random() * PAL.length)], r: 16 + Math.random() * 12, o: Math.random() * TAU });
  }
  function burst(x, y) {
    for (let i = 0; i < 80; i++) {
      const a = Math.random() * TAU, sp = 3 + Math.random() * 9;
      confetti.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4, rot: Math.random() * TAU,
        vr: (Math.random() - .5) * .4, c: PAL[Math.floor(Math.random() * PAL.length)], life: 1, w: 4 + Math.random() * 6, h: 3 + Math.random() * 4 });
    }
    for (let i = 0; i < 3; i++) spawnBalloon(x + (Math.random() - .5) * 60, y + 20);
  }
  canvas.addEventListener('pointerdown', e => burst(e.clientX, e.clientY));
  addEventListener('pointermove', e => { tx = (e.clientX / W - .5) * 2; ty = (e.clientY / H - .5) * 2; }, { passive: true });
  addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    tx = Math.max(-1, Math.min(1, e.gamma / 30)); ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
  }, { passive: true });

  function cloud(c, t) {
    const x = ((c.x + t * c.v * (reduced ? 0 : 1)) % 1.3 - .15) * W - px * 30 * c.depth;
    const y = c.y * H - py * 12 * c.depth;
    ctx.save(); ctx.translate(x, y); ctx.scale(c.s, c.s);
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath();
    for (const p of c.puffs) { ctx.moveTo(p.dx + p.rr, p.dy); ctx.arc(p.dx, p.dy, p.rr, 0, TAU); }
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,1)';
    ctx.beginPath(); for (const p of c.puffs) { ctx.moveTo(p.dx + p.rr * .7, p.dy - 6); ctx.arc(p.dx, p.dy - 6, p.rr * .7, 0, TAU); } ctx.fill();
    ctx.restore();
  }

  function frame(now) {
    const t = now / 1000;
    px += (tx - px) * .04; py += (ty - py) * .04;

    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#5fb8ff'); sky.addColorStop(.55, '#a9dcff'); sky.addColorStop(1, '#ffeec8');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // sun + rays
    const sx = W * .8 - px * 12, sy = H * .2 - py * 8, sr = Math.min(W, H) * .07;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(reduced ? 0 : t * .05);
    ctx.fillStyle = 'rgba(255,225,120,.22)';
    for (let i = 0; i < 12; i++) {
      ctx.rotate(TAU / 12);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(sr * 6, -sr * .6); ctx.lineTo(sr * 6, sr * .6); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    const glow = ctx.createRadialGradient(sx, sy, sr * .8, sx, sy, sr * 3);
    glow.addColorStop(0, 'rgba(255,240,170,.8)'); glow.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(sx, sy, sr * 3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd95c'; ctx.beginPath(); ctx.arc(sx, sy, sr * (1 + Math.sin(t * 1.5) * .02), 0, TAU); ctx.fill();

    // clouds (back)
    for (const c of clouds) if (c.depth < .6) cloud(c, t);

    // birds
    ctx.strokeStyle = 'rgba(40,60,90,.7)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (const b of birds) {
      const x = ((b.x + t * b.v * (reduced ? 0 : 1)) % 1.2 - .1) * W - px * 20;
      const y = b.y * H + Math.sin(t * 1.5 + b.o) * 8 - py * 10;
      const f = Math.sin(t * 6 + b.o) * 5 * b.s, s = 10 * b.s;
      ctx.beginPath(); ctx.moveTo(x - s, y - f); ctx.quadraticCurveTo(x - s / 2, y + f * .3, x, y);
      ctx.quadraticCurveTo(x + s / 2, y + f * .3, x + s, y - f); ctx.stroke();
    }

    // clouds (front)
    for (const c of clouds) if (c.depth >= .6) cloud(c, t);

    // hills
    for (const h of hills) {
      const dx = -px * 40 * h.depth, dy = -py * 14 * h.depth;
      ctx.fillStyle = h.color;
      ctx.beginPath(); ctx.moveTo(-80, H + 80);
      for (const p of h.pts) ctx.lineTo(p.x * (W + 160) - 80 + dx, p.y * H + dy);
      ctx.lineTo(W + 80, H + 80); ctx.closePath(); ctx.fill();
    }

    // flowers swaying on the front two hills
    for (const f of flowers) {
      const h = hills[f.h];
      const dx = -px * 40 * h.depth, dy = -py * 14 * h.depth;
      const x = f.u * (W + 160) - 80 + dx, y = hillY(h, f.u) * H + dy + 4;
      const sway = reduced ? 0 : Math.sin(t * 2 + f.o) * 3;
      ctx.strokeStyle = '#2f8f3a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + sway, y - 8, x + sway, y - 14); ctx.stroke();
      ctx.fillStyle = f.c;
      for (let k = 0; k < 5; k++) {
        const a = k / 5 * TAU + f.o;
        ctx.beginPath(); ctx.arc(x + sway + Math.cos(a) * f.s, y - 14 + Math.sin(a) * f.s, f.s * .7, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = '#fff4b0'; ctx.beginPath(); ctx.arc(x + sway, y - 14, f.s * .55, 0, TAU); ctx.fill();
    }

    // butterflies
    for (const b of bfl) {
      if (!reduced) {
        b.a += (Math.random() - .5) * .3;
        b.x += Math.cos(b.a) * 1.2; b.y += Math.sin(b.a) * .8 + Math.sin(t * 3 + b.o) * .4;
        if (b.x < -20) b.x = W + 20; if (b.x > W + 20) b.x = -20;
        b.y = Math.max(H * .45, Math.min(H * .9, b.y));
      }
      const flap = Math.abs(Math.sin(t * 12 + b.o));
      ctx.fillStyle = b.c;
      ctx.beginPath(); ctx.ellipse(b.x - 5 * flap, b.y, 6 * flap + 1, 5, -.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(b.x + 5 * flap, b.y, 6 * flap + 1, 5, .4, 0, TAU); ctx.fill();
    }

    // balloons
    if (!reduced && Math.random() < .012 && balloons.length < 14) spawnBalloon(Math.random() * W, H + 40);
    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i];
      b.x += b.vx + Math.sin(t * 1.3 + b.o) * .4; b.y += b.vy;
      if (b.y < -80) { balloons.splice(i, 1); continue; }
      ctx.strokeStyle = 'rgba(60,60,80,.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(b.x, b.y + b.r); ctx.quadraticCurveTo(b.x + Math.sin(t * 2 + b.o) * 6, b.y + b.r * 2.2, b.x, b.y + b.r * 3.4); ctx.stroke();
      ctx.fillStyle = b.c;
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r * .85, b.r, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(b.x - 4, b.y + b.r + 4); ctx.lineTo(b.x + 4, b.y + b.r + 4); ctx.lineTo(b.x, b.y + b.r - 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.beginPath(); ctx.ellipse(b.x - b.r * .3, b.y - b.r * .35, b.r * .2, b.r * .32, -.5, 0, TAU); ctx.fill();
    }

    // confetti
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.vy += .18; c.vx *= .985; c.vy *= .985; c.x += c.vx; c.y += c.vy; c.rot += c.vr; c.life -= .008;
      if (c.life <= 0 || c.y > H + 20) { confetti.splice(i, 1); continue; }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.globalAlpha = Math.min(1, c.life * 2);
      ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore();
    }

    requestAnimationFrame(frame);
  }

  addEventListener('resize', build);
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
