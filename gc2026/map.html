<script>
(function(){
var K='gc26.key',P=JSON.parse(document.getElementById('payload').textContent);
if(/[?&]password=/.test(location.search))history.replaceState(null,'',location.pathname);
function b2u(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function store(k,rem){try{localStorage.removeItem(K);sessionStorage.removeItem(K);(rem?localStorage:sessionStorage).setItem(K,k)}catch(e){}}
function stored(){try{return localStorage.getItem(K)||sessionStorage.getItem(K)}catch(e){return null}}
function forget(){try{localStorage.removeItem(K);sessionStorage.removeItem(K)}catch(e){}}
var ok=!!(window.crypto&&crypto.subtle&&window.TextEncoder);
function derive(pw){var e=new TextEncoder();return crypto.subtle.importKey('raw',e.encode(pw.trim().normalize('NFC')),'PBKDF2',false,['deriveBits']).then(function(b){return crypto.subtle.deriveBits({name:'PBKDF2',salt:b2u(P.s),iterations:P.n,hash:'SHA-256'},b,256)}).then(function(bits){return u2b(new Uint8Array(bits))})}
function unseal(raw){return crypto.subtle.importKey('raw',b2u(raw),'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(P.i)},k,b2u(P.c))}).then(function(buf){return new TextDecoder().decode(buf)})}
function show(html){var go=function(){document.open();document.write(html);document.close()};if(document.readyState==='complete')setTimeout(go,0);else addEventListener('load',function(){setTimeout(go,0)})}
function gate(m){document.getElementById('gate').hidden=false;if(m)document.getElementById('msg').textContent=m;try{document.getElementById('pw').focus()}catch(e){}}
/* the form handler comes first, so no path can ever submit the password in the address */
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();var b=document.getElementById('go'),m=document.getElementById('msg');
 if(!ok){m.textContent='Questo browser non può aprire la pagina (serve un browser aggiornato e https).';return}
 b.disabled=true;b.textContent='Apro…';m.textContent='';
 derive(document.getElementById('pw').value).then(function(raw){return unseal(raw).then(function(html){store(raw,document.getElementById('rem').checked);show(html)})}).catch(function(){b.disabled=false;b.textContent='Apri';m.textContent='Password sbagliata.'})});
/* keep a copy for places without signal (the files are encrypted, so caching them is safe) */
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
if(!ok){gate('Questo browser non può aprire la pagina (serve un browser aggiornato e https).');return}
var h=location.hash.match(/[#&]k=([^&]+)/);
if(h){var pw=null;try{pw=decodeURIComponent(h[1])}catch(e){}history.replaceState(null,'',location.pathname);
 if(!pw){gate('Il link non è valido: inserisci la password.');return}
 derive(pw).then(function(raw){return unseal(raw).then(function(html){store(raw,true);show(html)})}).catch(function(){gate('Il link contiene una password vecchia o sbagliata.')});return}
var raw=stored();
if(raw){unseal(raw).then(show).catch(function(){forget();gate('La password è cambiata: inseriscila di nuovo.')})}else gate();
})();
</script></body></html>
